name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IDML_ENVIRONMENT: test
      IDML_DATABASE_URL: sqlite+pysqlite:///:memory:
      IDML_REDIS_URL: redis://127.0.0.1:6379/15
      IDML_ARTIFACT_ROOT: /tmp/idml-test-artifacts
      IDML_SESSION_PEPPER: ci-only-not-a-production-secret-00000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - name: Verify corpus provenance metadata and holdout isolation
        run: python ops/gate_phase7_v01.py --metadata-only
      - name: Run V-02 IDML ingestion security matrix
        run: python ops/gate_phase7_v02.py
      - name: Run V-03 IDML reading and fidelity gate
        run: python ops/gate_phase7_v03.py
      - name: Run V-04 domain-model integrity gate
        run: python ops/gate_phase7_v04.py
      - name: Run V-05 JATS/SPS construction gate
        run: python ops/gate_phase7_v05.py
      - name: Run V-07 semantic-fidelity mutation gate
        run: python ops/gate_phase7_v07.py
      - name: Run V-08 assistive OpenClaw qualification gate
        run: python ops/gate_phase7_v08.py
      - name: Run V-09 security, identity, and tenant-isolation gate
        run: python ops/gate_phase7_v09.py
      - name: Check repository for obvious secrets
        run: |
          if git grep -nE '(sk-proj-|BEGIN (RSA|OPENSSH) PRIVATE KEY|password=[^$<{])' -- ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Possible secret found"
            exit 1
          fi
